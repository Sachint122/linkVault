plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing — filled from keystore.properties (gitignored).
def kprops = new Properties()
def kfile = file("keystore.properties")
if (kfile.exists()) {
    kfile.withInputStream { kprops.load(it) }
}

android {
    namespace 'com.linkvault.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.linkvault.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (kfile.exists()) {
                storeFile file(kprops['storeFile'])
                storePassword kprops['storePassword']
                keyAlias kprops['keyAlias']
                keyPassword kprops['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // minify off until release build is device-verified by owner.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (kfile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.navigation:navigation-fragment:2.8.4'
    implementation 'androidx.navigation:navigation-ui:2.8.4'
    implementation 'androidx.work:work-runtime:2.10.0'
    // On-device LLM runtime (offline AI). CPU backend; model file is NOT
    // bundled — pushed by the user (see AI_MODEL_SETUP.md).
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
